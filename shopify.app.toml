# Bitsy Auto – vehicle parts finder (YMM + VIN) for Shopify.
# Fitment comes live from TecDoc through Supabase; nothing about fitment is stored in Shopify.
# https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

client_id = "REPLACE_WITH_BITSY_AUTO_CLIENT_ID"
name = "Bitsy Auto"
# No server of our own: Shopify hosts the admin screens (extensions/admin-home).
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# read_products                         product and variant counts on Home
# write_online_store_pages              list pages and create the results page
# read_themes                           check whether the app embed is switched on
# unauthenticated_read_product_listings Storefront API: product cards on results and collections
# unauthenticated_read_product_inventory Storefront API: stock status on cards
scopes = "read_products,write_online_store_pages,read_themes,unauthenticated_read_product_listings,unauthenticated_read_product_inventory"

[auth]
redirect_urls = [ "https://shopify.dev/apps/app-home/api/auth" ]

[app_proxy]
# Storefront calls /apps/bitsy/* on the shop's own domain; Shopify signs and forwards them.
url = "https://uclehygojvydvyzsqvzk.supabase.co/functions/v1/storefront"
prefix = "apps"
subpath = "bitsy"
