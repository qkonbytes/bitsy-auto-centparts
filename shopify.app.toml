# Bitsy Auto: CentParts YMM app. Fitment comes live from Supabase through the App Proxy.
client_id = "REPLACE_WITH_BITSY_AUTO_CLIENT_ID"
name = "Bitsy Auto"
application_url = "https://REPLACE_WITH_APP_URL"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# read_products: admin catalogue reads. unauthenticated_*: what the Storefront API token may read for the product cards.
scopes = "read_products,read_themes,unauthenticated_read_product_listings,unauthenticated_read_product_inventory"

[app_proxy]
# Storefront calls /apps/bitsy/* on the store's domain; Shopify signs and forwards them.
url = "https://uclehygojvydvyzsqvzk.supabase.co/functions/v1/storefront"
prefix = "apps"
subpath = "bitsy"

[auth]
redirect_urls = [ "https://REPLACE_WITH_APP_URL/api/auth-callback" ]
